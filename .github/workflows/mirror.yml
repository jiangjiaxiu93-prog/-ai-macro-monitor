name: Mirror to backup repo

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to zhangmao6237/ai-macro-monitor
        run: |
          git remote add mirror "https://zhangmao6237:${MIRROR_TOKEN}@github.com/zhangmao6237/ai-macro-monitor.git"
          git push mirror --all --force
          git push mirror --tags --force
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}

